<text x="862" y="381" text-anchor="middle" font-size="18" fill="#d0f78a">Scheduled mirror</text>
<rect x="806" y="432" width="240" height="80" rx="5" fill="#151d31" stroke="#adbcd6" stroke-width="2"/><text x="926" y="465" text-anchor="middle" font-size="23">Cyborg</text><text x="926" y="493" text-anchor="middle" font-size="18" fill="#b5bfd3">Compute helper</text>
<path d="M54 599h1092" stroke="#3b455a"/><text x="55" y="646" font-size="20" fill="#b5bfd3">File access</text><text x="211" y="646" font-size="20">Web · SMB · WebDAV</text>
</g></svg>
