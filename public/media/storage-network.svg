<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Tamestorage network topology</title>
<desc id="desc">Mac and iPad connect through Tailscale to an Ubuntu host. The host writes to primary NAS storage and schedules a backup to a second disk. A separate compute helper runs optional jobs.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#97b5ff" opacity=".18"/></pattern>
<g id="disk" fill="#151d31" stroke="#bac4e0" stroke-width="2"><path d="M-61 -10v52c0 12 27 22 61 22s61-10 61-22v-52"/><ellipse cy="-10" rx="61" ry="22"/><path d="M-60 7c8 23 111 23 120 0M-60 24c8 23 111 23 120 0" fill="none"/></g>
</defs>
<rect width="1200" height="700" fill="#101727"/><rect width="1200" height="700" fill="url(#grid)"/>
<g font-family="system-ui,sans-serif" fill="#edf0fa">
<text x="54" y="73" font-size="35" font-weight="600">Storage network</text><text x="55" y="108" font-size="20" fill="#b5bfd3">Tamestorage</text>
<g fill="none" stroke="#a9b7d1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M209 256h70v86h104M209 461h70V342"/><path d="M610 342h88v-86h108M695 342h304v-86" stroke="#d0f78a"/>
<path d="M610 370h80v101h115" stroke-dasharray="4 8"/>
<rect x="104" y="221" width="91" height="59" rx="4"/><path d="M96 289h108l-8 5h-92z"/>
<rect x="125" y="421" width="53" height="78" rx="5"/><path d="M143 488h17"/>
</g>
<g transform="translate(392 275)"><rect width="218" height="138" rx="7" fill="#d0f78a"/><rect x="18" y="21" width="48" height="31" rx="2" fill="none" stroke="#1a2818" stroke-width="2"/><path d="M16 58h52" stroke="#1a2818" stroke-width="3"/><text x="17" y="91" font-size="26" font-weight="650" fill="#152016">Ubuntu host</text><text x="18" y="119" font-size="18" fill="#344635">Lenovo G480</text></g>
<g fill="#c5d1e8" font-size="22" text-anchor="middle"><text x="150" y="333">Mac</text><text x="151" y="539">iPad</text></g>
<text x="259" y="390" font-family="monospace" font-size="18" fill="#b4c3dc">Tailscale</text>
<use href="#disk" x="824" y="212"/><use href="#disk" x="1000" y="212"/>
